<div class="space-y-5 p-1 text-left">
  
  <div class="bg-blue-50/50 p-3 rounded-xl border border-blue-100 space-y-2">
    <div class="flex items-center gap-1.5 text-sm font-bold text-blue-900 border-b border-blue-200 pb-1">
      <span>📦 納品（のうひん）の記録</span>
    </div>
    <div>
      <label class="block text-[11px] font-bold text-gray-500 mb-1">納品写真</label>
      <div class="border-2 border-dashed border-blue-200 rounded-lg p-3 text-center bg-white hover:bg-blue-50 transition cursor-pointer">
        <span class="text-xs text-blue-600 font-medium">📸 納品写真を撮影・選択</span>
        <input type="file" accept="image/*" multiple class="hidden">
      </div>
    </div>
    <div>
      <label class="block text-[11px] font-bold text-gray-500 mb-1">納品メモ・内容</label>
      <textarea placeholder="例: 納品箱数、サイン受領など" class="w-full border p-2 rounded-lg text-xs bg-white" rows="2"></textarea>
    </div>
  </div>

  <div class="bg-green-50/50 p-3 rounded-xl border border-green-100 space-y-2">
    <div class="flex items-center gap-1.5 text-sm font-bold text-green-950 border-b border-green-200 pb-1">
      <span>♻️ 引取（ひきとり）の記録</span>
    </div>
    <div>
      <label class="block text-[11px] font-bold text-gray-500 mb-1">引取写真</label>
      <div class="border-2 border-dashed border-green-200 rounded-lg p-3 text-center bg-white hover:bg-green-50 transition cursor-pointer">
        <span class="text-xs text-green-700 font-medium">📸 引取写真を撮影・選択</span>
        <input type="file" accept="image/*" multiple class="hidden">
      </div>
    </div>
    <div>
      <label class="block text-[11px] font-bold text-gray-500 mb-1">引取メモ・内容</label>
      <textarea placeholder="例: 空パレット回収数、持ち帰り資材など" class="w-full border p-2 rounded-lg text-xs bg-white" rows="2"></textarea>
    </div>
  </div>

</div>
