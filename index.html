<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>車両・配車運行管理システム</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; }
    .photo-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .photo-thumb { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: #f1f5f9; }
    .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-thumb .del-btn { position: absolute; top: 3px; right: 3px; background: rgba(0,0,0,0.55); color: #fff; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .photo-add-btn { aspect-ratio: 1; border-radius: 8px; border: 2px dashed #cbd5e1; background: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; color: #94a3b8; font-size: 10px; gap: 3px; }
    .photo-add-btn:hover { border-color: #3b82f6; color: #3b82f6; }
    .photo-add-btn .icon { font-size: 18px; line-height: 1; }
    /* 車両タブ */
    .vtab { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1.5px solid #e2e8f0; background: #f8fafc; color: #64748b; cursor: pointer; white-space: nowrap; transition: all .15s; }
    .vtab.active { background: #1d4ed8; color: #fff; border-color: #1d4ed8; }
    .vtab-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .vtab-bar::-webkit-scrollbar { height: 0; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

  <div id="status-bar" class="bg-yellow-100 text-yellow-800 text-center py-2 text-sm font-medium flex items-center justify-center gap-2">
    <span class="w-3 h-3 rounded-full bg-yellow-500 animate-pulse"></span>
    <span id="status-text">データを読み込み中...</span>
  </div>

  <nav class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-4xl mx-auto flex justify-between text-center text-sm">
      <button onclick="switchTab('today')"     id="tab-today"     class="w-full py-4 text-blue-600 font-bold border-b-2 border-blue-600">本日の配車・運行</button>
      <button onclick="switchTab('calendar')"  id="tab-calendar"  class="w-full py-4 text-gray-600 hover:text-blue-600">カレンダー</button>
      <button onclick="switchTab('companies')" id="tab-companies" class="w-full py-4 text-gray-600 hover:text-blue-600">取引先マスタ</button>
      <button onclick="switchTab('vehicles')"  id="tab-vehicles"  class="w-full py-4 text-gray-600 hover:text-blue-600">車両管理</button>
      <button onclick="switchTab('checks')"    id="tab-checks"    class="w-full py-4 text-gray-600 hover:text-blue-600">月次点検</button>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto p-4 pb-24 space-y-4">

    <!-- ══════════════════════════════════════
         本日の配車・運行
         順序: ①車検アラート ②確定スケジュール ③運行計画
    ══════════════════════════════════════ -->
    <section id="view-today" class="tab-content space-y-4">

      <!-- ① 車検アラート -->
      <div id="today-alerts" class="space-y-2"></div>

      <!-- ② 確定スケジュール（車両ごとタブ） -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-100">
        <div class="flex items-center justify-between px-4 pt-4 pb-2 border-b">
          <h2 class="text-base font-bold text-gray-700">✅ 本日の確定スケジュール</h2>
          <span id="today-date-display" class="text-xs text-gray-400"></span>
        </div>
        <!-- 車両タブバー -->
        <div class="px-4 pt-3">
          <div class="vtab-bar" id="confirmed-vtab-bar"></div>
        </div>
        <div id="today-final-list" class="p-4 space-y-3 min-h-[60px]"></div>
      </div>

      <!-- ③ 運行計画（チェック・設定） -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 space-y-3">
        <div class="flex items-center justify-between border-b pb-2">
          <h2 class="text-base font-bold text-gray-700">🚛 本日の運行計画（チェック・設定）</h2>
        </div>
        <p class="text-xs text-gray-400">※基本パターン・事前予定が自動チェックされています。</p>
        <div id="today-dispatch-selector" class="space-y-2"></div>

        <div class="text-right">
          <button onclick="toggleOtherCompanies()" id="btn-toggle-others" class="text-xs bg-gray-100 text-gray-600 hover:bg-gray-200 px-3 py-2 rounded-lg font-medium transition">
            ＋ スポット便（他曜日の取引先）を表示
          </button>
        </div>
        <div id="today-dispatch-selector-others" class="space-y-2 border-t pt-3 hidden">
          <p class="text-[11px] font-bold text-gray-400">【スポット便エリア】</p>
          <div id="today-dispatch-selector-others-list" class="space-y-2"></div>
        </div>

        <button onclick="saveTodayDispatch()" class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold hover:bg-blue-700 transition shadow-sm">
          本日の運行日程を確定・更新する
        </button>
      </div>
    </section>

    <!-- ══════════════════════════════════════
         カレンダー
         ・定期便を反映
         ・車両フィルタ
         ・日付ボタン → 詳細パネル
    ══════════════════════════════════════ -->
    <section id="view-calendar" class="tab-content hidden space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-sm">
        <!-- ヘッダー行 -->
        <div class="flex justify-between items-center mb-3">
          <button onclick="changeMonth(-1)" class="px-3 py-1 bg-gray-100 rounded hover:bg-gray-200 text-sm">◀</button>
          <span id="calendar-month-title" class="text-lg font-bold"></span>
          <button onclick="changeMonth(1)"  class="px-3 py-1 bg-gray-100 rounded hover:bg-gray-200 text-sm">▶</button>
        </div>
        <!-- 車両フィルタ -->
        <div class="vtab-bar mb-3" id="cal-vtab-bar"></div>
        <!-- 曜日ヘッダー -->
        <div class="grid grid-cols-7 gap-1 text-center font-bold text-xs text-gray-400 mb-1">
          <div class="text-red-400">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="text-blue-400">土</div>
        </div>
        <div id="calendar-grid" class="grid grid-cols-7 gap-1"></div>
      </div>

      <!-- 日付詳細パネル -->
      <div id="calendar-detail" class="bg-white p-4 rounded-xl shadow-sm hidden">
        <div class="flex items-center justify-between mb-3">
          <h3 id="calendar-detail-date" class="font-bold text-blue-600"></h3>
          <button onclick="document.getElementById('calendar-detail').classList.add('hidden')" class="text-gray-400 text-lg">×</button>
        </div>
        <div id="calendar-detail-list" class="space-y-2"></div>
      </div>
    </section>

    <!-- ══════════════════════════════════════
         取引先マスタ（定期／不定期 左右表示）
    ══════════════════════════════════════ -->
    <section id="view-companies" class="tab-content hidden space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-bold border-l-4 border-blue-600 pl-2">取引先マスタ</h2>
        <button onclick="openCompanyModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700">＋ 追加</button>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <!-- 定期 -->
        <div class="space-y-3">
          <h3 class="text-xs font-bold text-blue-700 bg-blue-50 px-3 py-1.5 rounded-lg">📅 定期便</h3>
          <div id="companies-regular" class="space-y-2"></div>
        </div>
        <!-- 不定期 -->
        <div class="space-y-3">
          <h3 class="text-xs font-bold text-gray-600 bg-gray-100 px-3 py-1.5 rounded-lg">📋 不定期</h3>
          <div id="companies-irregular" class="space-y-2"></div>
        </div>
      </div>
    </section>

    <!-- ══════════════════════════════════════
         車両管理
    ══════════════════════════════════════ -->
    <section id="view-vehicles" class="tab-content hidden space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-bold border-l-4 border-blue-600 pl-2">車両の管理</h2>
        <button onclick="openVehicleModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700">＋ 車両を追加</button>
      </div>
      <div id="vehicles-list" class="grid gap-4 sm:grid-cols-2"></div>
    </section>

    <!-- ══════════════════════════════════════
         月次点検（点検者名追加）
    ══════════════════════════════════════ -->
    <section id="view-checks" class="tab-content hidden space-y-4">
      <h2 class="text-xl font-bold border-l-4 border-blue-600 pl-2">月次点検表（26項目）</h2>
      <div class="bg-white p-4 rounded-xl shadow-sm flex flex-wrap gap-3 items-end">
        <div><label class="block text-xs text-gray-500 mb-1">対象車両</label><select id="check-vehicle" class="border p-2 rounded-lg text-sm bg-gray-50" onchange="loadCheckData()"></select></div>
        <div><label class="block text-xs text-gray-500 mb-1">点検年</label><select id="check-year" class="border p-2 rounded-lg text-sm bg-gray-50" onchange="loadCheckData()"></select></div>
        <div><label class="block text-xs text-gray-500 mb-1">点検月</label><select id="check-month" class="border p-2 rounded-lg text-sm bg-gray-50" onchange="loadCheckData()"></select></div>
        <div class="flex-1 min-w-[160px]"><label class="block text-xs text-gray-500 mb-1">点検者名</label><input type="text" id="check-inspector" placeholder="例: 田中 太郎" class="w-full border p-2 rounded-lg text-sm"></div>
      </div>
      <div id="check-form-container" class="bg-white rounded-xl shadow-sm p-4 space-y-6"></div>
      <div class="bg-white p-4 rounded-xl shadow-sm space-y-2">
        <label class="block text-sm font-medium text-gray-700">特記事項・メモ</label>
        <textarea id="check-note" class="w-full border p-2 rounded-lg text-sm" rows="3"></textarea>
      </div>
      <button onclick="saveCheckData()" class="w-full bg-green-600 text-white p-3 rounded-xl font-bold hover:bg-green-700 transition shadow-md">点検結果を保存</button>
    </section>
  </main>

  <!-- ══ 実績入力モーダル ══ -->
  <div id="delivery-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-start justify-center p-4 overflow-y-auto">
    <div class="bg-white p-5 rounded-2xl w-full max-w-md space-y-4 my-6 shadow-xl">
      <div class="flex justify-between items-center border-b pb-2">
        <div>
          <h3 id="delivery-modal-title" class="text-base font-bold text-gray-900">📦 配送完了報告</h3>
          <p id="delivery-modal-date" class="text-xs text-gray-400 mt-0.5"></p>
        </div>
        <button onclick="closeDeliveryModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold px-2">×</button>
      </div>
      <!-- 納品 -->
      <div class="bg-blue-50/70 p-3 rounded-xl border border-blue-100 space-y-3">
        <span class="text-xs font-bold text-blue-900 block border-b border-blue-200 pb-1">🚚 納品の記録</span>
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="text-[11px] font-bold text-gray-500">納品写真（最大5枚）</label>
            <span id="nouhin-count" class="text-[10px] text-gray-400">0 / 5</span>
          </div>
          <div class="photo-grid" id="nouhin-photo-grid"></div>
          <input type="file" id="nouhin-file-input" accept="image/*" multiple class="hidden" onchange="handlePhotoSelect('nouhin', event)">
        </div>
        <div>
          <label class="block text-[11px] font-bold text-gray-500 mb-1">納品メモ</label>
          <textarea id="nouhin-memo" placeholder="例: 納品ケース数、受領サインなど" class="w-full border border-gray-200 p-2 rounded-lg text-xs bg-white resize-none" rows="2"></textarea>
        </div>
      </div>
      <!-- 引取 -->
      <div class="bg-green-50/70 p-3 rounded-xl border border-green-100 space-y-3">
        <span class="text-xs font-bold text-green-900 block border-b border-green-200 pb-1">🔄 引取の記録</span>
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="text-[11px] font-bold text-gray-500">引取写真（最大5枚）</label>
            <span id="hikitori-count" class="text-[10px] text-gray-400">0 / 5</span>
          </div>
          <div class="photo-grid" id="hikitori-photo-grid"></div>
          <input type="file" id="hikitori-file-input" accept="image/*" multiple class="hidden" onchange="handlePhotoSelect('hikitori', event)">
        </div>
        <div>
          <label class="block text-[11px] font-bold text-gray-500 mb-1">引取メモ</label>
          <textarea id="hikitori-memo" placeholder="例: 空パレット回収数、持ち帰り資材など" class="w-full border border-gray-200 p-2 rounded-lg text-xs bg-white resize-none" rows="2"></textarea>
        </div>
      </div>
      <div class="flex justify-end gap-2 text-sm pt-2 border-t">
        <button onclick="closeDeliveryModal()" class="px-4 py-2 bg-gray-100 rounded-lg font-medium">キャンセル</button>
        <button onclick="submitDeliveryReport()" class="px-5 py-2 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 transition">💾 保存する</button>
      </div>
    </div>
  </div>

  <!-- 写真拡大 -->
  <div id="photo-lightbox" class="fixed inset-0 bg-black/80 z-[60] hidden flex items-center justify-center p-4" onclick="closeLightbox()">
    <img id="lightbox-img" src="" class="max-w-full max-h-full rounded-xl">
  </div>

  <!-- ══ 取引先モーダル ══ -->
  <div id="company-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white p-6 rounded-2xl w-full max-w-md space-y-4">
      <h3 id="company-modal-title" class="text-lg font-bold">取引先の登録</h3>
      <input type="hidden" id="c-id">
      <div><label class="block text-xs text-gray-500 mb-1">会社名・取引先名</label><input type="text" id="c-name" placeholder="例: ○○工業 A工場" class="w-full border p-2 rounded-lg text-sm"></div>
      <div><label class="block text-xs text-gray-500 mb-1">デフォルト出発時刻</label><input type="time" id="c-time" class="w-full border p-2 rounded-lg text-sm"></div>
      <div>
        <label class="block text-xs text-gray-500 mb-1">基本の運行パターン</label>
        <select id="c-pattern" class="w-full border p-2 rounded-lg text-sm bg-gray-50">
          <option value="毎営業日">毎営業日</option>
          <option value="月,木">月・木 固定</option>
          <option value="火,金">火・金 固定</option>
          <option value="水">水曜 固定</option>
          <option value="不定期・かんばん次第">不定期・かんばん次第</option>
        </select>
      </div>
      <div><label class="block text-xs text-gray-500 mb-1">備考</label><input type="text" id="c-note" class="w-full border p-2 rounded-lg text-sm"></div>
      <div class="flex justify-end gap-2 text-sm">
        <button onclick="closeCompanyModal()" class="px-4 py-2 bg-gray-100 rounded-lg">キャンセル</button>
        <button onclick="submitCompany()" class="px-4 py-2 bg-blue-600 text-white rounded-lg">保存する</button>
      </div>
    </div>
  </div>

  <!-- ══ 車両モーダル ══ -->
  <div id="vehicle-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white p-6 rounded-2xl w-full max-w-md space-y-4">
      <h3 id="vehicle-modal-title" class="text-lg font-bold">車両の登録</h3>
      <input type="hidden" id="v-id">
      <input type="text" id="v-name" placeholder="車両名・ナンバー" class="w-full border p-2 rounded-lg text-sm">
      <input type="text" id="v-type" placeholder="車種" class="w-full border p-2 rounded-lg text-sm">
      <div><label class="block text-xs text-gray-500 mb-1">車検満了日</label><input type="date" id="v-shaken" class="w-full border p-2 rounded-lg text-sm"></div>
      <div><label class="block text-xs text-gray-500 mb-1">任意保険更新日</label><input type="date" id="v-insurance" class="w-full border p-2 rounded-lg text-sm"></div>
      <input type="text" id="v-note" placeholder="備考" class="w-full border p-2 rounded-lg text-sm">
      <div class="flex justify-end gap-2 text-sm">
        <button onclick="closeVehicleModal()" class="px-4 py-2 bg-gray-100 rounded-lg">キャンセル</button>
        <button onclick="submitVehicle()" class="px-4 py-2 bg-blue-600 text-white rounded-lg">保存する</button>
      </div>
    </div>
  </div>

  <!-- ══ 記録閲覧モーダル ══ -->
  <div id="record-viewer-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-start justify-center p-4 overflow-y-auto">
    <div class="bg-white p-5 rounded-2xl w-full max-w-md space-y-4 my-6 shadow-xl">
      <div class="flex justify-between items-center border-b pb-2">
        <div>
          <h3 id="rv-title" class="text-base font-bold text-gray-900"></h3>
          <p id="rv-date" class="text-xs text-gray-400 mt-0.5"></p>
        </div>
        <button onclick="closeRecordViewer()" class="text-gray-400 hover:text-gray-600 text-xl font-bold px-2">×</button>
      </div>
      <!-- 納品 -->
      <div class="bg-blue-50/70 p-3 rounded-xl border border-blue-100 space-y-2">
        <span class="text-xs font-bold text-blue-900 block border-b border-blue-200 pb-1">🚚 納品の記録</span>
        <div class="flex gap-2 flex-wrap" id="rv-nouhin-photos"></div>
        <p class="text-xs text-gray-500 font-medium mt-1">メモ：</p>
        <p id="rv-nouhin-memo" class="text-xs text-gray-700 bg-white p-2 rounded-lg border border-blue-100 min-h-[36px]"></p>
      </div>
      <!-- 引取 -->
      <div class="bg-green-50/70 p-3 rounded-xl border border-green-100 space-y-2">
        <span class="text-xs font-bold text-green-900 block border-b border-green-200 pb-1">🔄 引取の記録</span>
        <div class="flex gap-2 flex-wrap" id="rv-hikitori-photos"></div>
        <p class="text-xs text-gray-500 font-medium mt-1">メモ：</p>
        <p id="rv-hikitori-memo" class="text-xs text-gray-700 bg-white p-2 rounded-lg border border-green-100 min-h-[36px]"></p>
      </div>
      <div class="flex justify-end pt-2 border-t">
        <button onclick="closeRecordViewer()" class="px-4 py-2 bg-gray-100 rounded-lg text-sm font-medium">閉じる</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxXlU1hfoPqjDiL4KQJg0vZFtDnNjlFUh0RedtfekkgnGGpJrfmOt-ogFjPoEVJYu9Q6w/exec';
    let db = { vehicles: [], routes: [], checks: [], delivery_records: [] };
    let holidays = {};
    let currentYear, currentMonth;
    let selectedDeliveryCompanyName = '';
    let confirmedVehicleFilter = 'all'; // 確定スケジュールの車両フィルタ
    let calVehicleFilter = 'all';        // カレンダーの車両フィルタ
    const todayObj = new Date();
    const todayStr = `${todayObj.getFullYear()}-${String(todayObj.getMonth()+1).padStart(2,'0')}-${String(todayObj.getDate()).padStart(2,'0')}`;
    const todayDay = ['日','月','火','水','木','金','土'][todayObj.getDay()];

    // ── 写真ステート ──
    const photoState = { nouhin: [], hikitori: [] };
    const MAX_PHOTOS = 5;

    // ════════════════════════════════════════════════════════
    //  写真グリッド
    // ════════════════════════════════════════════════════════
    function renderPhotoGrid(type) {
      const grid    = document.getElementById(`${type}-photo-grid`);
      const counter = document.getElementById(`${type}-count`);
      const photos  = photoState[type];
      grid.innerHTML = '';
      counter.textContent = `${photos.length} / ${MAX_PHOTOS}`;
      photos.forEach((p, idx) => {
        const thumb = document.createElement('div');
        thumb.className = 'photo-thumb';
        thumb.innerHTML = `<img src="${p.dataUrl}" onclick="openLightbox('${p.dataUrl}')" style="cursor:zoom-in"><button class="del-btn" onclick="removePhoto('${type}',${idx})">✕</button>`;
        grid.appendChild(thumb);
      });
      if (photos.length < MAX_PHOTOS) {
        const add = document.createElement('div');
        add.className = 'photo-add-btn';
        add.innerHTML = `<span class="icon">📷</span><span>追加</span>`;
        add.onclick = () => document.getElementById(`${type}-file-input`).click();
        grid.appendChild(add);
      }
    }
    function handlePhotoSelect(type, event) {
      const files = Array.from(event.target.files);
      const remaining = MAX_PHOTOS - photoState[type].length;
      files.slice(0, remaining).forEach(file => {
        const reader = new FileReader();
        reader.onload = e => { photoState[type].push({ dataUrl: e.target.result, file }); renderPhotoGrid(type); };
        reader.readAsDataURL(file);
      });
      event.target.value = '';
    }
    function removePhoto(type, idx) { photoState[type].splice(idx, 1); renderPhotoGrid(type); }
    function openLightbox(src) { document.getElementById('lightbox-img').src = src; document.getElementById('photo-lightbox').classList.remove('hidden'); }
    function closeLightbox() { document.getElementById('photo-lightbox').classList.add('hidden'); }

    // ════════════════════════════════════════════════════════
    //  実績モーダル
    // ════════════════════════════════════════════════════════
    function openDeliveryModal(companyName) {
      selectedDeliveryCompanyName = companyName;
      document.getElementById('delivery-modal-title').innerText = `📦 ${companyName}`;
      document.getElementById('delivery-modal-date').innerText  = todayStr;
      photoState.nouhin = []; photoState.hikitori = [];

    function loadAllData() {
      updateStatus('loading', '最新情報を取得中...');
      let loaded = 0;
      const sheets = ['vehicles','routes','checks','delivery_records'];
      const total = sheets.length;

      sheets.forEach(sheet => {
        const cb = `callback_${sheet}_${Date.now()}`;

        // タイムアウト：3秒以内に返答なければスキップ
        const timer = setTimeout(() => {
          if (!window[cb + '_done']) {
            window[cb + '_done'] = true;
            db[sheet] = db[sheet] || [];
            if (++loaded === total) { updateStatus('success','スプレッドシートと同期完了'); refreshAllViews(); }
          }
        }, 3000);

        window[cb] = function(res) {
          if (window[cb + '_done']) return;
          window[cb + '_done'] = true;
          clearTimeout(timer);
          db[sheet] = res.data || [];
          if (++loaded === total) { updateStatus('success','スプレッドシートと同期完了'); refreshAllViews(); }
        };

        const s = document.createElement('script');
        s.onerror = () => {
          if (window[cb + '_done']) return;
          window[cb + '_done'] = true;
          clearTimeout(timer);
          db[sheet] = db[sheet] || [];
          if (++loaded === total) { updateStatus('success','スプレッドシートと同期完了'); refreshAllViews(); }
        };
        s.src = `${GAS_URL}?sheet=${sheet}&callback=${cb}&_=${Date.now()}`;
        document.body.appendChild(s);
      });
    }

      const todayRecs   = db.routes.filter(r => r.note && (String(r.note).includes(todayStr)||String(r.note).includes(todaySlash)));

      let mainItems = [], otherItems = [];
      uniqueNames.forEach(name => {
        const base     = db.routes.find(r => r.name===name && (!r.note||(!String(r.note).includes('-')&&!String(r.note).includes('/'))));
        const todayRow = todayRecs.find(s => s.name===name);
        let isChecked = false, time = todayRow?(todayRow.time||''):(base?(base.time||''):'');
        let vid = todayRow?(todayRow.vehicleId||''):(base?(base.vehicleId||''):'');
        let label = base?`パターン: ${base.days||'未設定'}`:'直入力';
        let isTodayPat = false;
        const fid = 'ROW_'+name.replace(/\s+/g,'');
        if (todayRow) { isTodayPat=true; isChecked=(todayRow.days==='GO'); label=`📅 スプレッド入力 (${todayRow.days})`; }
        else if (base) {
          if (base.days==='毎営業日') { isTodayPat=true; isChecked=true; }
          else if (base.days&&String(base.days).split(',').map(d=>d.trim()).includes(todayDay)) { isTodayPat=true; isChecked=true; }
          else if (!base.days||String(base.days).includes('不定期')) { isTodayPat=true; isChecked=false; }
          else { isTodayPat=false; }
        } else { isTodayPat=true; }
        const obj = {id:fid, name, time, vehicleId:vid, isChecked, label};
        if (isTodayPat) mainItems.push(obj); else otherItems.push(obj);

    // 定期便の曜日チェック用
    const DAY_MAP = ['日','月','火','水','木','金','土'];

    function getScheduledCompaniesForDate(dateObj) {
      // 定期便マスタ（noteなし or note非日付）
      const masters = db.routes.filter(r => !r.note||((!String(r.note).includes('-'))&&(!String(r.note).includes('/'))));
      const dow = DAY_MAP[dateObj.getDay()];
      const fd  = `${dateObj.getFullYear()}-${String(dateObj.getMonth()+1).padStart(2,'0')}-${String(dateObj.getDate()).padStart(2,'0')}`;
      const fs  = fd.replace(/-/g,'/');
      const isHol = holidays[fd] !== undefined;
      const isWeekend = (dateObj.getDay()===0||dateObj.getDay()===6);

      let companies = [];

      // ① 定期便（パターン）
      masters.forEach(r => {
        if (!r.days) return;
        const active = (r.days==='毎営業日'&&!isHol&&!isWeekend) || String(r.days).split(',').map(d=>d.trim()).includes(dow);
        if (active) {
          // 実績（その日のGO/SKIP）を確認
          const actual = db.routes.find(x => x.name===r.name && x.note && (String(x.note).includes(fd)||String(x.note).includes(fs)));
          if (actual && actual.days==='SKIP') return; // SKIPなら除外
          companies.push({ name:r.name, vehicleId: actual?actual.vehicleId:(r.vehicleId||''), time: actual?actual.time:(r.time||''), type:'regular', confirmed: !!actual });
        }
      });

      // ② 当日直接入力のGO（スポット便）
      db.routes.forEach(r => {
        if (!r.note) return;
        const n = String(r.note).trim();
        if ((n.includes(fd)||n.includes(fs)) && r.days==='GO') {
          if (!companies.some(c=>c.name===r.name)) {
            companies.push({ name:r.name, vehicleId:r.vehicleId||'', time:r.time||'', type:'spot', confirmed:true });
          }
        }
      });

      return companies;
    }

    function renderCalendar() {
      document.getElementById('calendar-month-title').innerText = `${currentYear}年 ${currentMonth}月`;
      buildCalVtabs();
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';
      const firstDay = new Date(currentYear, currentMonth-1, 1).getDay();
      const lastDate = new Date(currentYear, currentMonth, 0).getDate();

      for (let i=0; i<firstDay; i++) grid.innerHTML += '<div class="h-16 bg-gray-50/50 rounded"></div>';

      for (let date=1; date<=lastDate; date++) {
        const dObj = new Date(currentYear, currentMonth-1, date);
        const fd = `${currentYear}-${String(currentMonth).padStart(2,'0')}-${String(date).padStart(2,'0')}`;
        const dow = dObj.getDay();
        const isHol = holidays[fd]!==undefined;
        const isWeekend = dow===0||dow===6;
        const isToday = fd===todayStr;

        let companies = getScheduledCompaniesForDate(dObj);

        // 車両フィルタ
        if (calVehicleFilter !== 'all') {
          companies = companies.filter(c => String(c.vehicleId)===String(calVehicleFilter));
        }

        // 確定件数・定期件数
        const confirmedCount = companies.filter(c=>c.confirmed).length;
        const totalCount     = companies.length;

        // 今日=オレンジ / 日・祝=薄赤 / 土=薄青 / 平日=白
        let bgCls = 'bg-white', numCls = 'text-gray-700', borderCls = 'border-gray-100';
        if (isToday)             { bgCls='bg-orange-500'; numCls='text-white'; borderCls='border-orange-400'; }
        else if (isHol||dow===0) { bgCls='bg-red-50'; numCls='text-red-400'; }
        else if (dow===6)        { bgCls='bg-sky-50'; numCls='text-sky-500'; }

        // ドット: 確定=緑、定期(未確定)=グレー  ※今日セルは白系
        const dotHtml = totalCount > 0
          ? `<div class="flex gap-0.5 justify-center flex-wrap">${companies.slice(0,5).map(c=>
              `<span class="w-1.5 h-1.5 rounded-full inline-block ${c.confirmed ? (isToday?'bg-white':'bg-emerald-500') : (isToday?'bg-orange-200':'bg-gray-300')}"></span>`
            ).join('')}</div>` : '';

        const countBadge = totalCount > 0
          ? `<span class="text-[9px] ${isToday?'text-orange-100':'text-gray-400'}">${confirmedCount}/${totalCount}</span>` : '';

        grid.innerHTML += `
          <button onclick="showCalendarDetail(${date})"
            class="h-16 ${bgCls} border ${borderCls} rounded-lg p-1 flex flex-col items-center justify-between hover:opacity-80 transition w-full">
            <span class="text-xs font-bold ${numCls}">${date}</span>
            ${dotHtml}
            ${countBadge}
          </button>`;
      }
    }

    // 記録閲覧モーダル用ステート
    let viewingRecord = null;

    function showCalendarDetail(date) {
      const detail = document.getElementById('calendar-detail');
      const fd = `${currentYear}-${String(currentMonth).padStart(2,'0')}-${String(date).padStart(2,'0')}`;
      document.getElementById('calendar-detail-date').innerText = `${fd} の運行予定・実績`;
      detail.classList.remove('hidden');

      const dObj = new Date(currentYear, currentMonth-1, date);
      let companies = getScheduledCompaniesForDate(dObj);
      if (calVehicleFilter!=='all') companies = companies.filter(c=>String(c.vehicleId)===String(calVehicleFilter));

      const list = document.getElementById('calendar-detail-list');
      list.innerHTML = '';
      if (companies.length===0) { list.innerHTML='<p class="text-xs text-gray-400 text-center py-3">この日の運行予定はありません。</p>'; return; }

      companies.sort((a,b)=>(a.time||'').localeCompare(b.time||''));
      companies.forEach(c => {
        const v = db.vehicles.find(x=>String(x.id)===String(c.vehicleId));
        const badge = c.confirmed
          ? '<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-100 text-emerald-700">✅ 確定</span>'
          : '<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-gray-100 text-gray-500">📅 定期</span>';
        const typeBadge = c.type==='spot'
          ? '<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-purple-100 text-purple-700">スポット</span>' : '';

        // delivery_recordsから該当レコードを取得
        const rec = (db.delivery_records||[]).find(r => r.date===fd && r.companyName===c.name);
        const hasRecord = !!rec;
        const recBtn = hasRecord
          ? `<button onclick="openRecordViewer('${fd}','${c.name.replace(/'/g,"\\'")}',${JSON.stringify(rec).replace(/"/g,'&quot;')})"
               class="text-[11px] font-bold px-3 py-1.5 rounded-lg bg-indigo-50 text-indigo-700 border border-indigo-200 hover:bg-indigo-100 transition whitespace-nowrap">
               📋 記録を見る
             </button>`
          : `<span class="text-[10px] text-gray-300 whitespace-nowrap">記録なし</span>`;

        list.innerHTML += `
          <div class="flex items-center justify-between p-2.5 bg-gray-50 rounded-lg gap-2">
            <div class="flex items-center gap-2 flex-wrap flex-1 min-w-0">
              ${badge}${typeBadge}
              <span class="font-bold text-gray-800 text-sm">${c.name}</span>
              <span class="text-xs text-gray-400">${c.time||'時間未定'} / ${v?v.name:'車両未定'}</span>
            </div>
            ${recBtn}
          </div>`;
      });
    }

    // ── 記録閲覧モーダル ──
    function openRecordViewer(fd, companyName, rec) {
      // recがstring（&quot;エスケープ）でくる場合があるのでparse
      if (typeof rec === 'string') { try { rec = JSON.parse(rec); } catch(e) { rec = {}; } }

      document.getElementById('rv-title').innerText    = `📋 ${companyName}`;
      document.getElementById('rv-date').innerText     = fd;
      document.getElementById('rv-nouhin-memo').innerText   = rec.nouhinMemo   || '（なし）';
      document.getElementById('rv-hikitori-memo').innerText = rec.hikitoriMemo || '（なし）';

      // 納品写真
      const npGrid = document.getElementById('rv-nouhin-photos');
      npGrid.innerHTML = '';
      const nouhinUrls = rec.nouhinPhotoUrls || [];
      if (nouhinUrls.length === 0) npGrid.innerHTML = '<p class="text-xs text-gray-300">写真なし</p>';
      else nouhinUrls.forEach(url => {
        npGrid.innerHTML += `<img src="${url}" onclick="openLightbox('${url}')" class="w-16 h-16 object-cover rounded-lg border border-gray-200 cursor-zoom-in hover:opacity-80">`;
      });

      // 引取写真
      const hpGrid = document.getElementById('rv-hikitori-photos');
      hpGrid.innerHTML = '';
      const hikitoriUrls = rec.hikitoriPhotoUrls || [];
      if (hikitoriUrls.length === 0) hpGrid.innerHTML = '<p class="text-xs text-gray-300">写真なし</p>';
      else hikitoriUrls.forEach(url => {
        hpGrid.innerHTML += `<img src="${url}" onclick="openLightbox('${url}')" class="w-16 h-16 object-cover rounded-lg border border-gray-200 cursor-zoom-in hover:opacity-80">`;
      });

      document.getElementById('record-viewer-modal').classList.remove('hidden');
    }
    function closeRecordViewer() { document.getElementById('record-viewer-modal').classList.add('hidden'); }

    // ════════════════════════════════════════════════════════
    //  取引先マスタ（定期／不定期 左右）
    // ════════════════════════════════════════════════════════
    function renderCompanies() {
      const regEl = document.getElementById('companies-regular');
      const irrEl = document.getElementById('companies-irregular');
      regEl.innerHTML = ''; irrEl.innerHTML = '';

      // マスタ行のみ（日付入りのスポット行を除外）
      const masters = db.routes.filter(r => {
        if (!r.name) return false;
        if (!r.note) return true;
        const n = String(r.note).trim();
        // 日付形式（YYYY-MM-DD or YYYY/MM/DD）を含む行は除外
        return !(/\d{4}[-\/]\d{2}[-\/]\d{2}/.test(n));
      });

      const regular   = masters.filter(r => r.days && !String(r.days).includes('不定期'));
      const irregular = masters.filter(r => !r.days || String(r.days).includes('不定期'));

      const cardHtml = (c) => `
        <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 text-xs space-y-1">
          <div class="flex justify-between items-start gap-1">
            <h4 class="font-bold text-gray-900 text-sm leading-tight">${c.name}</h4>
            <button onclick="openCompanyModal(${JSON.stringify(c).replace(/"/g,'&quot;')})" class="text-blue-500 hover:underline shrink-0">修正</button>
          </div>
          <span class="inline-block px-2 py-0.5 rounded bg-gray-100 text-gray-600 font-medium">${c.days||'未設定'}</span>
          ${c.time?`<p class="text-gray-500">⏰ ${c.time}</p>`:''}
          ${c.note?`<p class="text-gray-400 bg-yellow-50 px-2 py-1 rounded border border-yellow-100">💡 ${c.note}</p>`:''}
          <div class="text-right pt-1"><button onclick="deleteRow('routes','${c.id}')" class="text-red-400 hover:underline text-[10px]">削除</button></div>
        </div>`;

      if (regular.length===0)   regEl.innerHTML='<p class="text-xs text-gray-400 text-center py-4">なし</p>';
      else regular.forEach(c => { regEl.innerHTML += cardHtml(c); });
      if (irregular.length===0) irrEl.innerHTML='<p class="text-xs text-gray-400 text-center py-4">なし</p>';
      else irregular.forEach(c => { irrEl.innerHTML += cardHtml(c); });
    }

    function openCompanyModal(data=null) {
      document.getElementById('company-modal').classList.remove('hidden');
      if (data) {
        document.getElementById('company-modal-title').innerText='取引先の修正';
        document.getElementById('c-id').value=data.id; document.getElementById('c-name').value=data.name;
        document.getElementById('c-time').value=data.time||''; document.getElementById('c-pattern').value=data.days||'毎営業日'; document.getElementById('c-note').value=data.note||'';
      } else {
        document.getElementById('company-modal-title').innerText='取引先の新規登録';
        document.getElementById('c-id').value='M_'+Date.now(); document.getElementById('c-name').value='';
        document.getElementById('c-time').value=''; document.getElementById('c-pattern').value='毎営業日'; document.getElementById('c-note').value='';
      }
    }
    function closeCompanyModal() { document.getElementById('company-modal').classList.add('hidden'); }
    function submitCompany() {
      const id=document.getElementById('c-id').value, name=document.getElementById('c-name').value;
      if (!name) { alert('会社名を入力してください'); return; }
      upsertRow('routes',id,{id,name,from:'',to:'',time:document.getElementById('c-time').value,vehicleId:'',days:document.getElementById('c-pattern').value,note:document.getElementById('c-note').value});
      closeCompanyModal();
    }

    // ════════════════════════════════════════════════════════
    //  車両管理
    // ════════════════════════════════════════════════════════
    function renderVehicles() {
      const list=document.getElementById('vehicles-list'); list.innerHTML='';
      db.vehicles.forEach(v => {
        list.innerHTML+=`
          <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-between text-sm">
            <div><h4 class="font-bold text-gray-900">${v.name}</h4><p class="text-xs text-gray-400">${v.type||'車種未指定'}</p>
              <div class="mt-2 space-y-0.5 text-xs text-gray-600"><p>🛠 車検満了: ${v.shaken||'未登録'}</p><p>📄 任意保険: ${v.insurance||'未登録'}</p></div>
            </div>
            <div class="flex justify-end gap-3 mt-3 pt-2 border-t border-gray-50 text-xs">
              <button onclick="openVehicleModal(${JSON.stringify(v).replace(/"/g,'&quot;')})" class="text-blue-600 hover:underline">修正</button>
              <button onclick="deleteRow('vehicles','${v.id}')" class="text-red-500 hover:underline">削除</button>
            </div>
          </div>`;
      });
    }
    function openVehicleModal(data=null) {
      document.getElementById('vehicle-modal').classList.remove('hidden');
      if (data) {
        document.getElementById('v-id').value=data.id; document.getElementById('v-name').value=data.name; document.getElementById('v-type').value=data.type||'';
        document.getElementById('v-shaken').value=data.shaken||''; document.getElementById('v-insurance').value=data.insurance||''; document.getElementById('v-note').value=data.note||'';
      } else {
        document.getElementById('v-id').value='V'+Date.now(); document.getElementById('v-name').value=''; document.getElementById('v-type').value='';
        document.getElementById('v-shaken').value=''; document.getElementById('v-insurance').value=''; document.getElementById('v-note').value='';
      }
    }
    function closeVehicleModal() { document.getElementById('vehicle-modal').classList.add('hidden'); }
    function submitVehicle() {
      const id=document.getElementById('v-id').value;
      upsertRow('vehicles',id,{id,name:document.getElementById('v-name').value,type:document.getElementById('v-type').value,shaken:document.getElementById('v-shaken').value,insurance:document.getElementById('v-insurance').value,note:document.getElementById('v-note').value});
      closeVehicleModal();
    }

    // ════════════════════════════════════════════════════════
    //  月次点検（点検者名追加）
    // ════════════════════════════════════════════════════════
    function updateDropdowns() {
      const s=document.getElementById('check-vehicle'); if(!s) return;
      s.innerHTML=''; db.vehicles.forEach(v=>{s.innerHTML+=`<option value="${v.id}">${v.name}</option>`;});
    }
    function initCheckFormSelectors() {
      const y=document.getElementById('check-year'), m=document.getElementById('check-month');
      if(!y||!m) return;
      y.innerHTML=''; m.innerHTML='';
      for(let yr=currentYear-1;yr<=currentYear+1;yr++) y.innerHTML+=`<option value="${yr}" ${yr===currentYear?'selected':''}>${yr}年</option>`;
      for(let mo=1;mo<=12;mo++) m.innerHTML+=`<option value="${mo}" ${mo===currentMonth?'selected':''}>${mo}月</option>`;
    }
    function renderCheckForm() {
      const c=document.getElementById('check-form-container'); if(!c) return;
      c.innerHTML='';
      const cats=[...new Set(CHECK_ITEMS.map(i=>i.category))];
      cats.forEach(cat=>{
        let h=`<div class="space-y-2"><h3 class="text-xs font-bold text-gray-400 bg-gray-100 px-2 py-1 rounded">${cat}</h3>`;
        CHECK_ITEMS.filter(i=>i.category===cat).forEach(item=>{
          h+=`<div class="flex flex-col sm:flex-row sm:items-center justify-between py-1.5 border-b border-gray-50 text-sm">
            <span class="text-gray-700">${item.label}</span>
            <div class="flex gap-1">
              <button onclick="setMark('${item.key}','○')" id="mark-${item.key}-○" class="w-9 h-7 rounded border text-xs font-bold bg-white text-gray-400">○</button>
              <button onclick="setMark('${item.key}','△')" id="mark-${item.key}-△" class="w-9 h-7 rounded border text-xs font-bold bg-white text-gray-400">△</button>
              <button onclick="setMark('${item.key}','×')" id="mark-${item.key}-×" class="w-9 h-7 rounded border text-xs font-bold bg-white text-gray-400">×</button>
            </div></div>`;
        });
        c.innerHTML+=h+`</div>`;
      });
    }
    let currentMarks={};
    function setMark(key,val) {
      currentMarks[key]=val;
      ['○','△','×'].forEach(v=>{const b=document.getElementById(`mark-${key}-${v}`);if(b)b.className="w-9 h-7 rounded border text-xs font-bold bg-white text-gray-400 border-gray-200";});
      const b=document.getElementById(`mark-${key}-${val}`);
      if(b){if(val==='○')b.className="w-9 h-7 rounded text-xs font-bold bg-green-600 text-white";if(val==='△')b.className="w-9 h-7 rounded text-xs font-bold bg-yellow-500 text-white";if(val==='×')b.className="w-9 h-7 rounded text-xs font-bold bg-red-600 text-white";}
    }
    function loadCheckData() {
      const vSel=document.getElementById('check-vehicle'); if(!vSel) return;
      const vId=vSel.value,year=document.getElementById('check-year').value,month=document.getElementById('check-month').value;
      CHECK_ITEMS.forEach(item=>{currentMarks[item.key]='';['○','△','×'].forEach(v=>{const b=document.getElementById(`mark-${item.key}-${v}`);if(b)b.className="w-9 h-7 rounded border text-xs font-bold bg-white text-gray-400 border-gray-200";});});
      document.getElementById('check-note').value='';
      document.getElementById('check-inspector').value='';
      if(!vId) return;
      const recs=db.checks.filter(c=>c.vehicleId==vId&&c.year==year&&c.month==month);
      if(recs.length>0){
        recs.forEach(r=>{if(r.itemKey)setMark(r.itemKey,r.value);});
        document.getElementById('check-note').value=recs[0].note||'';
        document.getElementById('check-inspector').value=recs[0].inspector||'';
      }
    }
    function saveCheckData() {
      const vId=document.getElementById('check-vehicle').value; if(!vId){alert('車両を選択してください');return;}
      updateStatus('loading','点検データを保存中...');
      sendPostRequest({action:'save_check',sheet:'checks',vehicleId:vId,year:document.getElementById('check-year').value,month:document.getElementById('check-month').value,marks:currentMarks,note:document.getElementById('check-note').value,inspector:document.getElementById('check-inspector').value,savedAt:new Date().toLocaleString('ja-JP')});
    }

    // ════════════════════════════════════════════════════════
    //  通信共通
    // ════════════════════════════════════════════════════════
    function upsertRow(sheet,id,row){updateStatus('loading','送信中...');sendPostRequest({action:'upsert',sheet,id,row});}
    function deleteRow(sheet,id){if(!confirm('削除しますか？'))return;updateStatus('loading','削除中...');sendPostRequest({action:'delete',sheet,id});}
    function sendPostRequest(payload){
      fetch(GAS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
      .then(()=>{setTimeout(loadAllData,1000);}).catch(err=>{updateStatus('error','通信エラー: '+err.message);});
    }
    function updateStatus(type,text){
      const bar=document.getElementById('status-bar'),txt=document.getElementById('status-text'),dot=bar.querySelector('span');
      if(txt)txt.innerText=text;
      if(type==='loading'){bar.className="bg-yellow-100 text-yellow-800 text-center py-2 text-sm font-medium flex items-center justify-center gap-2";dot.className="w-3 h-3 rounded-full bg-yellow-500 animate-pulse";}
      else if(type==='success'){bar.className="bg-green-100 text-green-800 text-center py-2 text-sm font-medium flex items-center justify-center gap-2";dot.className="w-3 h-3 rounded-full bg-green-500";}
      else{bar.className="bg-red-100 text-red-800 text-center py-2 text-sm font-medium flex items-center justify-center gap-2";dot.className="w-3 h-3 rounded-full bg-red-500";}
    }
  </script>
</body>
