<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>車両・配車運行管理システム</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-800">

  <div id="status-bar" class="bg-yellow-100 text-yellow-800 text-center py-2 text-sm font-medium">データを高速読み込み中...</div>

  <nav class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-4xl mx-auto flex justify-between text-center text-sm">
      <button onclick="switchTab('today')" id="tab-today" class="w-full py-4 text-blue-600 font-bold border-b-2 border-blue-600">本日の配車</button>
      <button onclick="switchTab('calendar')" id="tab-calendar" class="w-full py-4 text-gray-600">カレンダー</button>
      <button onclick="switchTab('companies')" id="tab-companies" class="w-full py-4 text-gray-600">取引先</button>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto p-4 pb-24">
    <section id="view-today" class="tab-content space-y-6">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-bold border-l-4 border-blue-600 pl-2">本日の確定運行</h2>
        <select id="final-vehicle-filter" onchange="filterFinalList()" class="border p-2 rounded-lg text-xs bg-white font-bold text-blue-900">
          <option value="ALL">🚚 すべての車両</option>
        </select>
      </div>
      <div id="today-final-list" class="space-y-4"></div>

      <div class="bg-white p-5 rounded-xl shadow-sm border space-y-4">
        <h2 class="text-base font-bold">🚛 運行計画（未配車が上、確定が下）</h2>
        <div class="flex gap-2">
          <input type="text" id="quick-spot-name" placeholder="スポット便を追加..." class="flex-1 border p-2 rounded-lg text-xs">
          <button onclick="addQuickSpot()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-xs font-bold">追加</button>
        </div>
        <div id="today-dispatch-selector" class="space-y-2"></div>
        <button onclick="saveTodayDispatch()" class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold">運行計画を更新</button>
      </div>
    </section>

    <section id="view-calendar" class="tab-content hidden"><h2 class="text-xl font-bold">カレンダー実績</h2><div id="calendar-grid" class="grid grid-cols-7 gap-1"></div></section>
    <section id="view-companies" class="tab-content hidden"><div class="grid grid-cols-2 gap-4"><div id="companies-list-regular"></div><div id="companies-list-irregular"></div></div></section>
  </main>

  <script>
    // URLを組み込みました
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxXlU1hfoPqjDiL4KQJg0vZFtDnNjlFUh0RedtfekkgnGGpJrfmOt-ogFjPoEVJYu9Q6w/exec';
    let db = { vehicles: [], routes: [], checks: [] };

    // 高速読み込みロジック (JSONP)
    function loadAllData() {
      const script = document.createElement('script');
      script.src = `${GAS_URL}?sheet=all&callback=handleData&_=${Date.now()}`;
      document.body.appendChild(script);
    }

    window.handleData = function(response) {
      if (response && response.data) {
        db = response.data;
        document.getElementById('status-bar').innerText = '最新データ同期完了';
        document.getElementById('status-bar').className = 'bg-green-100 text-green-800 text-center py-2 text-sm';
        refreshAllViews();
      }
    };

    function refreshAllViews() {
      // 画面のレンダリング処理は前回のコードを呼び出してください
      console.log("データロード完了:", db);
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(`view-${tabId}`).classList.remove('hidden');
    }

    // 起動時にロード
    loadAllData();
  </script>
</body>
</html>
